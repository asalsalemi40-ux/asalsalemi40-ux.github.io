{%- assign p = include.project -%}
<article class="work-item">
	<a class="work-media{% if p.card_fit == 'contain' %} light{% endif %}" href="{{ p.url | relative_url }}" aria-label="{{ p.title }}">
		<img src="{{ p.card | relative_url }}" alt="{{ p.card_alt }}"{% if p.card_fit == 'contain' %} class="contain"{% endif %} loading="lazy">
		{%- if p.card_alt_img %}
		<img class="alt{% if p.alt_fit == 'contain' %} contain{% endif %}" src="{{ p.card_alt_img | relative_url }}" alt="" loading="lazy">
		<span class="peek">{{ p.peek }}</span>
		{%- endif %}
	</a>
	<div class="work-text">
		<p class="discipline">{{ p.discipline }}</p>
		<h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
		<p>{{ p.summary }}</p>
		<p class="context">{{ p.context }}</p>
		<a class="text-link" href="{{ p.url | relative_url }}">View project</a>
	</div>
</article>
