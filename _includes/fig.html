<figure{% if include.wide %} class="wide"{% endif %}><a class="zoom{% if include.cover %} cover{% endif %}" href="{{ include.src | relative_url }}" data-caption="{{ include.caption | escape }}"{% if include.ratio %} style="--r: {{ include.ratio }}"{% endif %}><img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy"></a>{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}</figure>
