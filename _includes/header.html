<!-- Header -->
  <header id="header">
    <a href="{{ '/' | relative_url }}" class="logo"><strong>{{ site.title }}</strong><span>{{ site.subtitle }}</span></a>
    <ul class="icons">
      <li><a href="mailto:{{ site.email }}" class="icon fa-envelope-o" title="Email"><span class="label">Email</span></a></li>
      {% if site.linkedin_url %}<li><a href="{{ site.linkedin_url }}" class="icon fa-linkedin" target="_blank" rel="noopener" title="LinkedIn"><span class="label">LinkedIn</span></a></li>{% endif %}
      {% if site.behance_url %}<li><a href="{{ site.behance_url }}" class="icon fa-behance" target="_blank" rel="noopener" title="Behance"><span class="label">Behance</span></a></li>{% endif %}
      {% if site.instagram_url %}<li><a href="{{ site.instagram_url }}" class="icon fa-instagram" target="_blank" rel="noopener" title="Instagram"><span class="label">Instagram</span></a></li>{% endif %}
      <li><a href="{{ site.portfolio_pdf | relative_url }}" class="icon fa-file-pdf-o" title="Portfolio (PDF)"><span class="label">Portfolio (PDF)</span></a></li>
    </ul>
  </header>
