<html lang="en">

{% include head.html %}

<body>

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Main -->
        <div id="main">
            <div class="inner">

                {% include header.html %}

                <!-- Content -->
                <section>
                    <header class="main">
                        <h1>{{ page.title }}</h1>
                        {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
                    </header>

                    {% if page.image %}
                    <span class="image main"><img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}" /></span>
                    {% endif %}

                    {{ content }}
                </section>

            </div>
        </div>

        {% include sidebar.html %}

    </div>

    {% include footer.html %}

</body>

</html>
